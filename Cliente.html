<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente - Gas Gotita</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>

<body>
    <header>
        <div>
            <img src="img/logoGotita.png" alt="Logotipo">
            <h1>Distribuidora de Gas Gotita</h1>
        </div>
    </header>
    <main>
        <h2>Pide tus productos aquí</h2>
        <section>
            <form>
                <div>
                    <label for="tipo-cliente">Tipo de Cliente / Tarifa</label>
                    <select id="tipo-cliente">
                        <option value="residencial">Residencial (Hogar)</option>
                        <option value="comercial">Comercial (Negocio)</option>
                    </select>
                </div>

                <fieldset>
                    <legend>Cilindros de Gas</legend>
                    <div>
                        
                        <label for="cilindro-5">Cilindro 5 KG C-$6.000 R-$6.500</label>
                        <input type="number" id="cilindro-5" min="0" max="10" value="0">
                    </div>

                    <div>
                        <label for="cilindro-11">Cilindro 11 KG C-$11.000 R-$12.000</label>
                        <input type="number" id="cilindro-11" min="0" max="10" value="0">
                    </div>

                    <div>
                        <label for="cilindro-15">Cilindro 15 KG C-$14.500 R-$16.000</label>
                        <input type="number" id="cilindro-15" min="0" max="10" value="0">
                    </div>

                    <div>
                        <label for="cilindro-45">Cilindro 45 KG C-$40.000 R-$45.000</label>
                        <input type="number" id="cilindro-45" min="0" max="10" value="0">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Reguladores</legend>
                    <div>
                        <label for="regulador-estandar">Regulador doméstico estándar C-$8.200 R-$8.990</label>
                        <input type="number" id="regulador-estandar" min="0" max="10" value="0">
                    </div>

                    <div>
                        <label for="regulador-alta">Regulador de alta presión C-$17.000 R-$18.990</label>
                        <input type="number" id="regulador-alta" min="0" max="10" value="0">
                    </div>

                    <div>
                        <label for="regulador-dual">Regulador dual (2 salidas) C-$13.500 R-$14.990</label>
                        <input type="number" id="regulador-dual" min="0" max="10" value="0">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Mangueras y Conexiones</legend>
                    <div>
                        <label for="manguera-15">Manguera de gas 1.5 m C-$3.500 R-$3.990</label>
                        <input type="number" id="manguera-15" min="0" max="10" value="0">
                    </div>

                    <div>
                        <label for="manguera-3">Manguera de gas 3 m C-$6.200 R-$6.990</label>
                        <input type="number" id="manguera-3" min="0" max="10" value="0">
                    </div>

                    <div>
                        <label for="abrazadera">Abrazadera metálica C-$800 R-$990</label>
                        <input type="number" id="abrazadera" min="0" max="20" value="0">
                    </div>

                    <div>
                        <label for="kit-conexion">Kit conexión completo C-$11.500 R-$12.990</label>
                        <input type="number" id="kit-conexion" min="0" max="10" value="0">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Accesorios</legend>
                    <div>
                        <label for="carro-porta">Carro porta cilindro 11/15 kg C-$11.000 R-$12.990</label>
                        <input type="number" id="carro-porta" min="0" max="5" value="0">
                    </div>

                    <div>
                        <label for="tapa-valvula">Tapa protectora para válvula C-$1.200 R-$1.490</label>
                        <input type="number" id="tapa-valvula" min="0" max="10" value="0">
                    </div>

                    <div>
                        <label for="detector-gas">Detector de gas a batería C-$17.000 R-$19.990</label>
                        <input type="number" id="detector-gas" min="0" max="5" value="0">
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Datos de Despacho</legend>
                    <div>
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" placeholder="Ej: Av. Siempre Viva 123, Chillán" required>
                    </div>

                    <div>
                        <label for="indicaciones">Indicaciones Adicionales (Opcional)</label>
                        <textarea id="indicaciones" rows="3"
                            placeholder="Ej: Condominio xx esperar en la entrada.."></textarea>
                    </div>

                    <div>
                        <p>Total Pedido: <strong id="total-pedido">$0</strong></p>
                    </div>
                </fieldset>

                <button type="submit">Confirmar Pedido</button>
            </form>
        </section>
        <nav>
            <a href="Inicio.html">Volver al inicio</a>
        </nav>
    </main>
    <footer>
        <div>
            <p>&copy; 2026 Distribuidora de Gas Gotita - Chillán, Región de Ñuble. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>

</html>
