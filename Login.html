<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión - Gas Gotita</title>
   <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>

<body>

    <header>
        <div>
            <img src="img/logoGotita.png" alt="Logotipo">
            <h1>Distribuidora de Gas Gotita</h1>
        </div>
    </header>

    <main>
        <section>
            <h2>Inicio de Sesión</h2>

            <form>
                <div >
                    <label for="rut">RUT</label>
                    <input type="text" id="rut" class="form-control" placeholder="12345678-9" required>
                </div>

                <div>
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary btn-full">Ingresar</button>

                <p>
                    <a href="Inicio.html">Volver al inicio</a>
                    <a href="Registro.html">Registrate</a>
                </p>
            </form>
        </section>
    </main>

    <footer >
        <div>
            <p>&copy; 2026 Distribuidora de Gas Gotita - Chillán, Región de Ñuble. Todos los derechos reservados.</p>
        </div>
    </footer>

</body>

</html>
